name: Tag

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Queue tag creation
        uses: softprops/turnstyle@ec9869921df7799d5afea364f4026770f3760342 # v3.3.5
        with:
          same-branch-only: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Create semantic version tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          commit_sha: ${{ github.event.workflow_run.head_sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
