name: Release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - name: Resolve release commit
        id: release
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            release_ref="$WORKFLOW_RUN_SHA"
          else
            release_ref="$GITHUB_SHA"
          fi

          if [[ ! "$release_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release commit: $release_ref" >&2
            exit 1
          fi

          echo "ref=$release_ref" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...

  version:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.new_tag || steps.existing_tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Create semantic version tag
        id: tag
        if: github.event_name == 'workflow_run'
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          commit_sha: ${{ needs.prepare.outputs.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
      - name: Use pushed tag
        id: existing_tag
        if: github.event_name == 'push'
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: |
          make build \
            GOOS=${{ matrix.goos }} \
            GOARCH=${{ matrix.goarch }} \
            VERSION=${{ needs.version.outputs.version }} \
            COMMIT=${{ needs.prepare.outputs.ref }} \
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
      - name: Archive
        shell: bash
        run: |
          cd dist
          binary="nistro-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = windows ]; then
            binary="${binary}.exe"
            zip -9 "${binary}.zip" "$binary"
          else
            tar -czf "${binary}.tar.gz" "$binary"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nistro-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nistro-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}

  verify-installer:
    needs: [version, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install released CLI
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/nistro-bin"
          sh install.sh --version "${{ needs.version.outputs.version }}" --install-dir "$install_dir" --no-modify-path
          if [ "${{ runner.os }}" = Windows ]; then
            "$install_dir/nistro.exe" --version
          else
            "$install_dir/nistro" --version
          fi
