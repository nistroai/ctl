name: Dispatch Private Canaries
run-name: Canary dispatch ${{ inputs.environment }} [${{ inputs.correlation-id }}]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Private protected environment
        type: choice
        options: [dev, production]
        required: true
      cli-version:
        description: Exact published CLI candidate tag
        type: string
        required: true
      suite:
        description: Private suite
        type: choice
        options: [lifecycle, health]
        default: lifecycle
        required: true
      source-run-id:
        description: Originating CLI Release run
        type: string
        required: true
      correlation-id:
        description: Parent release correlation
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Configure this environment to allow only main. Release-tag jobs hold no
    # production account or App credentials; this trusted dispatcher owns them.
    environment: canary-dispatch
    steps:
      - name: Require trusted default branch
        env:
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: '[[ "$REPOSITORY" == nistroai/ctl && "$REF" == refs/heads/main ]]'
      - name: Checkout trusted dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify exact originating release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          APPROVAL_MODE: dispatch
          CLI_VERSION: ${{ inputs.cli-version }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: python3 .github/scripts/approve-release.py
      - name: Dispatch and wait for private validation
        env:
          CANARY_APP_ID: ${{ secrets.CANARY_APP_ID }}
          CANARY_APP_PRIVATE_KEY: ${{ secrets.CANARY_APP_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_RUN_ID: ${{ steps.release.outputs.source-run-id }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TEST_SUITE: ${{ inputs.suite }}
        run: |
          python3 .github/scripts/dispatch-and-wait.py \
            --repository omnistrate/nistro-e2e-tests --environment "$TARGET_ENVIRONMENT" \
            --version "$RELEASE_VERSION" --source-run-id "$SOURCE_RUN_ID" --suite "$TEST_SUITE"
